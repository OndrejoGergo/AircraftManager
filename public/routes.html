<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Route Planner</title>

    <link rel="icon" type="image/png" href="./aircraft.png" />

    <script src="routes.js" defer></script>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm fixed-top p-3">
      <div class="container d-flex justify-content-between align-items-center">

        <span class="navbar-brand fw-bold mb-0">
          ✈ Aircraft Manager
        </span>

        <div class="d-flex gap-2">

          <a href="index.html" class="btn btn-outline-light">
            Aircrafts
          </a>

          <a href="routes.html" class="btn btn-outline-light">
            Route Planner
          </a>

        </div>

      </div>
    </nav>

    <div class="container" style="padding-top: 100px;">

      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

          <h2 class="mb-4">🎯 Route Planner</h2>

          <div class="row g-3">

            <div class="col-md-5">
              <label class="form-label fw-bold">
                🛫 From
              </label>

              <select id="from" class="form-select"></select>
            </div>

            <div class="col-md-5">
              <label class="form-label fw-bold">
                🛬 To
              </label>

              <select id="to" class="form-select"></select>
            </div>

            <div class="col-md-2 d-flex align-items-end">
              <button 
                class="btn btn-success w-100"
                onclick="calculateRoute()"
              >
                Calculate
              </button>
            </div>

          </div>

        </div>
      </div>

      <div id="route-info" class="mb-4"></div>

      <div class="row g-4" id="results"></div>

    </div>

  </body>
</html>
